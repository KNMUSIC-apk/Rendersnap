name: Build fix branch

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Collect jars
        run: |
          mkdir -p dist
          find . -path ./.git -prune -o -type f -path '*/build/libs/*.jar' -print0 | xargs -0 -r -I{} cp {} dist/
          ls -la dist
          test -n "$(ls dist/*.jar 2>/dev/null)" || { echo "No jars were produced"; exit 1; }

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: rendersnap-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
